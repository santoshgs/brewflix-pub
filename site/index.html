<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Brewflix</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#fffdf8;--ink:#1d1b16;--muted:#6d675c;--line:#e3ded2;
  --imdb:#c99a06;--beer:#b4560f;--ok:#2f7d4f;--bad:#b3261e;--chip:#efe9dc;
  --on-imdb:#1d1b16;--on-beer:#fffdf8;--fsq:#b8235a;--on-fsq:#fffdf8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140f;--panel:#1d1c16;--ink:#ece7da;--muted:#a39d8f;--line:#33312a;
  --imdb:#f2c230;--beer:#f08a3c;--ok:#6cc790;--bad:#ff8a80;--chip:#2a2821;--on-imdb:#15140f;--on-beer:#15140f;--fsq:#ff8fb3;--on-fsq:#15140f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140f;--panel:#1d1c16;--ink:#ece7da;--muted:#a39d8f;--line:#33312a;
  --imdb:#f2c230;--beer:#f08a3c;--ok:#6cc790;--bad:#ff8a80;--chip:#2a2821;--on-imdb:#15140f;--on-beer:#15140f;--fsq:#ff8fb3;--on-fsq:#15140f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header h1{font:700 28px/1.1 Georgia,"Iowan Old Style",serif;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 16px;flex-wrap:wrap}
header .intro{min-width:0;flex:1 1 280px}
.profiles{display:flex;gap:8px;flex-wrap:wrap}
.profiles a{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
.profiles a:hover{border-color:var(--muted)}
.profiles a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.profiles img{width:16px;height:16px;border-radius:3px;display:block}
.status{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.pill{background:var(--chip);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.pill.bad b{color:var(--bad)} .pill.ok b{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-weight:600}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent,var(--imdb))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile svg{display:block;width:20px;height:20px;margin-bottom:8px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .n{font:700 24px/1 Georgia,serif;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.bar a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);font-size:13px}
.bar a:hover{border-color:var(--accent)}
.bar label.dr{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.bar label.dr input{flex:0 0 auto;padding:7px 8px;font-size:13px;min-height:38px}
.bar button.clr{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:8px 4px;cursor:pointer;font-weight:600}
.count{color:var(--muted);font-size:13px}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
th[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--accent)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:inherit}
.mine{font-weight:700;color:var(--accent)}
.sub{color:var(--muted);font-size:12px}
.cell{display:flex;gap:10px;align-items:flex-start;min-width:0}
.cell .txt{min-width:0}
.thumb{flex:none;display:block;background:var(--chip);overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.poster{width:40px;height:60px;border-radius:4px}
.thumb.label{width:44px;height:44px;border-radius:50%}
.thumb.venue{width:44px;height:44px;border-radius:8px}
.comm{color:var(--muted);font-weight:600}
@media (max-width:640px){th,td{padding:8px 6px} .thumb.poster{width:34px;height:51px} .thumb.label{width:36px;height:36px} .thumb.venue{width:36px;height:36px}}
.more{display:block;margin:12px auto 0;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.empty{padding:32px;text-align:center;color:var(--muted)}
/* flavours + photo on check-ins */
.flav{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.flav span{font-size:11px;line-height:1;padding:4px 7px;border-radius:99px;background:var(--chip);color:var(--muted)}
.cell .txt{flex:1}
.photo{flex:none;width:48px;height:48px;border-radius:6px;overflow:hidden;padding:0;border:0;background:var(--chip);cursor:zoom-in}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,9,6,.86);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox .cnt{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;color:#fffdf8;font-size:13px}
.photo{position:relative}
.photo .more-n{position:absolute;right:2px;bottom:2px;background:rgba(10,9,6,.75);color:#fffdf8;font-size:10px;line-height:1;padding:2px 4px;border-radius:4px}
.shout{font-size:13px;margin-top:3px}
/* Swarm profile card */
.prof{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.prof .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prof .av{width:56px;height:56px;border-radius:50%;background:var(--chip);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font:700 20px/1 Georgia,serif;color:var(--muted)}
.prof .av img{width:100%;height:100%;object-fit:cover}
.prof .id{flex:1 1 200px;min-width:0}
.prof .nm{font:700 20px/1.2 Georgia,serif}
.prof .who>a{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);color:var(--ink);text-decoration:none}
.prof .who>a:hover{border-color:var(--accent)}
.ptiles{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.ptile{flex:1 0 88px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.ptile svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ptile .n{font:700 19px/1 Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptile .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
button.ptile{font:inherit;color:inherit;cursor:pointer}
button.ptile:hover,button.ptile:focus-visible{border-color:var(--accent);outline:none}
button.ptile .l::after{content:" ›";color:var(--accent)}
/* pop-over for all tips / all photos */
.pop{position:fixed;inset:0;z-index:40;background:rgba(10,9,6,.6);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.pop .box{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.pop header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop h2{font:700 18px/1.2 Georgia,serif;margin:0}
.pop header small{color:var(--muted);font:400 13px/1 ui-sans-serif,system-ui,sans-serif;margin-left:8px}
.pop .x{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:22px;color:var(--muted)}
.pop .x:hover,.pop .x:focus-visible{background:var(--chip);color:var(--ink)}
.pop .body{overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pgrid .photo{width:100%;height:auto;aspect-ratio:1;border-radius:8px}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.tips li{display:flex;gap:10px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tips li:last-child{border-bottom:0;padding-bottom:0}
.tips .t{flex:1;min-width:0}
.tips p{margin:0 0 4px}
.tips a{color:var(--accent)}
/* Swarm timeline */
.tl h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.tl h3:first-child{margin-top:4px}
#map{height:380px;border:1px solid var(--line);border-radius:10px;background:var(--chip);z-index:0;isolation:isolate}
#map .leaflet-popup-content{font:13px/1.4 ui-sans-serif,system-ui,sans-serif;color:#1d1b16;margin:10px 12px}
.rank li.b{display:block}
.rank li.b button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;width:100%;cursor:pointer;border-radius:6px}
.rank li.b button:focus-visible,.places th button:focus-visible,.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;margin-top:8px;display:inline-block}
.places{border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.places th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.places th button b{color:var(--accent);font-weight:400}
.places td:first-child button{all:unset;cursor:pointer;font-weight:600}
.places td.r,.places th.r{text-align:right}
@media (max-width:640px){#map{height:260px}}
/* drink statistics */
.stats{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.stats h2{font:700 17px/1.2 Georgia,serif;margin:0 0 2px}
.stats .note{color:var(--muted);font-size:12px;margin:0 0 10px}
.stats h2 .disc{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;cursor:pointer;border-radius:6px}
.stats h2 .disc:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.stats h2 .disc .chev{font:400 18px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted);transition:transform .15s}
.stats h2 .disc[aria-expanded=true] .chev{transform:rotate(180deg)}
.stats.closed .note{margin-bottom:0}
@media (prefers-reduced-motion:reduce){.stats h2 .disc .chev{transition:none}}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.seg button{flex:none;font-weight:600;font-size:13px;line-height:1;font-family:inherit;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg button:focus-visible,.photo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-size:14px}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{color:var(--muted);font-size:12px;margin-left:4px}
.rank .v{font-variant-numeric:tabular-nums;font-weight:700}
.rank .trk{grid-column:1/-1;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.rank .trk i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hist{position:relative;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.hist h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:600}
.hist svg{display:block;width:100%;height:auto;overflow:visible}
.hist .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.sm-only{display:none}
/* IMDb insights */
.ins-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ins-head h3{font-size:15px;margin:0}
.bars{position:relative;margin:4px 0 2px}
.bars svg{display:block;width:100%;height:auto}
.bars .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--accent)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(14px)}
.toggle:focus-visible,.genres button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table.mini{width:100%;font-size:13px}
table.mini th,table.mini td{padding:5px 8px;font-variant-numeric:tabular-nums}
table.mini th{position:static;cursor:default}
.genres{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.genres button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--chip);cursor:pointer}
.genres b{display:block;font-size:15px}
.genres small{color:var(--muted);font-size:13px}
.genres .star{color:var(--accent)}
.genres .chev{color:var(--muted);font-size:20px;line-height:1}
@media (prefers-reduced-motion:reduce){.toggle .sw,.toggle .sw::after{transition:none}}
@media (max-width:640px){.hide-sm{display:none} .sm-only{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="intro">
      <h1>Brewflix</h1>
      <p>Personal backup of IMDb ratings, Untappd and Swarm check-ins, refreshed daily.</p>
    </div>
    <nav class="profiles" id="profiles" aria-label="Profiles" hidden></nav>
  </header>
  <div class="status" id="status"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="view"></section>
</div>
<script>
const VIEWS = {
  imdb: {
    label: "IMDb ratings", file: "imdb_ratings", accent: "--imdb", sort: "date_rated", stats: "imdb",
    cols: [
      ["title", "Title", r => withThumb(poster(r.poster_url), "poster",
        `<a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="sub">${[r.year, r.title_type].filter(Boolean).map(esc).join(" · ")}</div>`
        + credits(r))],
      ["year", "Year", r => r.year ?? "", "num hide-sm"],
      ["user_rating", "Mine", r => r.user_rating != null ? `<span class="mine">${r.user_rating}</span>` : "", "num"],
      ["imdb_rating", "IMDb", r => r.imdb_rating != null ? `<span class="comm">${(+r.imdb_rating).toFixed(1)}</span>` : "", "num"],
      ["date_rated", "Rated", r => shortDate(r.date_rated), "num"],
    ],
    tiles: d => [
      [d.length, "titles rated", "film"],
      [avg(d, "user_rating"), "my average", "stickers"],
      [avg(d, "imdb_rating"), "IMDb average", "bars"],
      [d.filter(r => (r.date_rated || "").startsWith(String(new Date().getFullYear()))).length, "rated this year", "calendar"],
    ],
  },
  checkins: {
    label: "Untappd check-ins", file: "untappd_checkins", accent: "--beer", sort: "checkin_date", stats: "drink", date: "checkin_date",
    cols: [
      ["beer_name", "Beer", r => withThumb(labelOf(r), "label",
        `<a href="${r.checkin_url || "#"}" target="_blank" rel="noopener">${esc(r.beer_name)}</a><div class="sub">${esc(r.brewery_name || "")}${r.style ? " · " + esc(r.style) : ""}</div>`
        + `<div class="sub sm-only">${[shortDay(r.checkin_date), r.serving_type, strength(r)].filter(Boolean).map(esc).join(" · ")}</div>`
        + (r.comment ? `<div class="sub">“${esc(r.comment)}”</div>` : "")
        + (r.flavors ? `<div class="flav">${r.flavors.split(/,\s*/).map(f => `<span>${esc(f)}</span>`).join("")}</div>` : ""),
        photoOf(r))],
      ["user_rating", "Mine", r => r.user_rating != null ? `<span class="mine">${r.user_rating}</span>` : "", "num"],
      ["global_rating", "Global", r => r.global_rating != null ? `<span class="comm">${(+r.global_rating).toFixed(2)}</span>` : "", "num"],
      ["abv", "ABV", r => r.abv != null ? r.abv + "%" : "", "num hide-sm"],
      ["ibu", "IBU", r => r.ibu != null ? Math.round(r.ibu) : "", "num hide-sm"],
      ["checkin_date", "When", r => shortDate(r.checkin_date), "num hide-sm"],
    ],
    tiles: d => [
      [d.length, "check-ins", "mug"],
      [new Set(d.map(r => r.beer_id || r.beer_name)).size, "distinct beers", "bottle"],
      [new Set(d.map(r => r.brewery_name)).size, "breweries", "cities"],
      [avg(d, "user_rating", 2), "my average", "stickers"],
    ],
  },
  beers: {
    label: "Unique beers", file: "untappd_beers", accent: "--beer", sort: "last_checkin",
    cols: [
      ["beer_name", "Beer", r => withThumb(labelOf(r), "label",
        `<a href="${r.beer_url || "#"}" target="_blank" rel="noopener">${esc(r.beer_name)}</a><div class="sub">${esc(r.brewery_name || "")}</div><div class="sub sm-only">${[r.style, strength(r)].filter(Boolean).map(esc).join(" · ")}</div>`)],
      ["style", "Style", r => esc(r.style || ""), "hide-sm"],
      ["abv", "ABV", r => r.abv != null ? r.abv + "%" : "", "num hide-sm"],
      ["ibu", "IBU", r => r.ibu != null ? Math.round(r.ibu) : "", "num hide-sm"],
      ["user_rating", "Mine", r => r.user_rating ? `<span class="mine">${r.user_rating}</span>` : "", "num"],
      ["global_rating", "Global", r => r.global_rating != null ? `<span class="comm">${(+r.global_rating).toFixed(2)}</span>` : "", "num"],
      ["checkin_count", "Times", r => r.checkin_count ?? "", "num hide-sm"],
    ],
    tiles: d => [
      [d.length, "unique beers", "bottle"],
      [avg(d, "abv", 1) + (d.length ? "%" : ""), "average ABV", "percent"],
      [topBy(d, "style"), "top style", "tag"],
      [topBy(d, "brewery_name"), "top brewery", "cities"],
    ],
  },
  swarm: {
    label: "Swarm check-ins", file: "foursquare_checkins", accent: "--fsq", sort: "created_ts", stats: "timeline", profile: true, date: "checkin_date",
    cols: [
      ["venue_name", "Place", r => withThumb(venueThumb(r), "venue",
        `<a href="${esc(r.checkin_url || "#")}" target="_blank" rel="noopener noreferrer">${esc(r.venue_name || "Unnamed place")}</a>`
        + (r.category ? `<div class="sub">${esc(r.category)}</div>` : "")
        + (whereOf(r) ? `<div class="sub">${esc(whereOf(r))}</div>` : "")
        + `<div class="sub sm-only">${esc(shortDay(r.checkin_date))}</div>`
        + (r.shout ? `<div class="shout">“${esc(r.shout)}”</div>` : "")

}
function mountMap(slot, places, fitKey) {
  if (!mapState) {
    const el = document.createElement("div"); el.id = "map";
    mapState = { el, ready: false, pending: null, fit: null };
    loadLeaflet().then(() => {
      const map = L.map(el, { preferCanvas: true, worldCopyJump: true, minZoom: 1 }).setView([25, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(map);
      Object.assign(mapState, { map, dots: L.layerGroup(), heat: null, ready: true });
      map.on("zoomend", syncMapLayers);
      drawMap(mapState.pending);
    }).catch(() => { el.innerHTML = `<p class="note" style="padding:12px">The map couldn't be loaded.</p>`; });
  }
  slot.appendChild(mapState.el);
  mapState.pending = { places, fitKey };
  if (mapState.ready) drawMap(mapState.pending);
}
// world view: heat spots; from city level in: one dot per place
function syncMapLayers() {
  const { map, heat, dots } = mapState, close = map.getZoom() >= 11;
  if (close) { heat && map.removeLayer(heat); map.addLayer(dots); } else { map.removeLayer(dots); heat && map.addLayer(heat); }
}
function drawMap({ places, fitKey }) {
  const { map, dots } = mapState, pts = places.filter(p => p.lat != null && p.lng != null);
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--fsq").trim() || "#b8235a";
  if (mapState.heat) map.removeLayer(mapState.heat);
  const max = Math.max(1, ...pts.map(p => p.n));
  mapState.heat = L.heatLayer(pts.map(p => [p.lat, p.lng, .4 + .6 * Math.log(1 + p.n) / Math.log(1 + max)]),
    { radius: 16, blur: 14, minOpacity: .35, maxZoom: 5, gradient: { .35: "#f3a9c2", .7: "#d6336c", 1: "#8a1040" } });
  dots.clearLayers();
  for (const p of pts) L.circleMarker([p.lat, p.lng], { radius: Math.min(16, 4 + Math.sqrt(p.n)), color: accent, weight: 1, fillColor: accent, fillOpacity: .55 })
    .bindPopup(`<b>${esc(p.name)}</b><br>${esc([p.category, p.city].filter(Boolean).join(" · "))}<br><b>${p.n} check-in${p.n === 1 ? "" : "s"}</b> · last ${esc(shortDay(p.last))}`).addTo(dots);
  map.invalidateSize();
  if (pts.length && mapState.fit !== fitKey) { mapState.fit = fitKey; map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(.12), { maxZoom: 14 }); }
  syncMapLayers();
}

// ---------- Swarm: "all tips" and "all photos" pop-overs (opened from the profile tiles) ----------
function openPop(title, count, bodyHtml, wire) {
  const back = document.activeElement, pop = document.createElement("div");
  pop.className = "pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-modal", "true"); pop.setAttribute("aria-label", title);
  pop.innerHTML = `<div class="box"><header><h2>${esc(title)}<small>${esc(count)}</small></h2><button type="button" class="x" aria-label="Close">×</button></header><div class="body">${bodyHtml}</div></div>`;
  const close = () => { pop.remove(); document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; back && back.focus && back.focus(); };
  const onKey = e => { if (e.key === "Escape" && !document.querySelector(".lightbox")) close(); };
  pop.addEventListener("click", e => { if (e.target === pop || e.target.closest(".x")) close(); });
  document.addEventListener("keydown", onKey); document.body.style.overflow = "hidden"; document.body.appendChild(pop);
  pop.querySelector(".x").focus();
  wire && wire(pop.querySelector(".body"), close);
}
function showTips() {
  const tips = state.tips.slice().sort((a, b) => (b.created_ts || 0) - (a.created_ts || 0));
  const sized = u => (u || "").replace("/original/", "/160x160/");
  openPop("Tips", tips.length ? `${tips.length}` : "", tips.length ? `<ul class="tips">${tips.map(t => `<li>
      ${t.photo_url ? `<button class="photo" data-full="${esc(t.photo_url.replace("/original/", "/width960/"))}" data-cap="${esc(t.venue_name || "")}" aria-label="View tip photo"><img src="${esc(sized(t.photo_url))}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>` : ""}
      <div class="t"><p>${esc(t.text)}</p><div class="sub">${[t.venue_name ? `<b>${esc(t.venue_name)}</b>` : "", esc([t.city, t.state].filter(Boolean).join(", ")), esc(shortDay(t.tip_date)),
        /^https:\/\//.test(t.tip_url || "") ? `<a href="${esc(t.tip_url)}" target="_blank" rel="noopener noreferrer">open on Foursquare</a>` : ""].filter(Boolean).join(" · ")}</div></div></li>`).join("")}</ul>`
    : `<p class="note">Your tips haven't been backed up yet. They are saved by the next daily run.</p>`);
}
function showPhotos() {
  const sized = (u, size) => u.replace("/original/", `/${size}/`);
  // one tile per photo, newest check-in first; a tap opens that check-in's photos in the lightbox
  const shots = [];
  for (const r of state.data.swarm.slice().sort((a, b) => (b.created_ts || 0) - (a.created_ts || 0))) {
    const p = swarmPhoto(r); if (!p) continue;
    const urls = r.photo_urls.split(/\s+/).filter(Boolean), done = +r.photo_backup || 0, cap = [r.venue_name, shortDay(r.checkin_date)].filter(Boolean).join(" · ");
    urls.forEach((u, i) => shots.push({ thumb: i < done ? `fsq-thumbs/${r.checkin_id}-${i + 1}.webp` : sized(u, "160x160"), alt: i < done ? sized(u, "160x160") : "", fulls: p.fulls, at: i, cap }));
  }
  const STEP = 120; let shown = 0;
  openPop("Photos", shots.length ? `${shots.length.toLocaleString("en-US")}` : "", shots.length ? `<div class="pgrid"></div><button type="button" class="more" id="pg-more"></button>`
    : `<p class="note">No check-in photos yet.</p>`, body => {
    const grid = body.querySelector(".pgrid"), more = body.querySelector("#pg-more"); if (!grid) return;
    const add = () => {
      grid.insertAdjacentHTML("beforeend", shots.slice(shown, shown + STEP).map(s => `<button class="photo" data-full="${esc(s.fulls[s.at][0])}" data-fulls="${esc(JSON.stringify(s.fulls))}" data-at="${s.at}" data-cap="${esc(s.cap)}" title="${esc(s.cap)}" aria-label="Photo: ${esc(s.cap)}"><img src="${esc(s.thumb)}" data-alt="${esc(s.alt)}" alt="" loading="lazy" onerror="imgFallback(this)"></button>`).join(""));
      shown = Math.min(shots.length, shown + STEP);
      more.hidden = shown >= shots.length; more.textContent = `Show ${Math.min(STEP, shots.length - shown)} more of ${shots.length - shown}`;
    };
    more.onclick = add; add();
  });
}
document.addEventListener("click", e => { const b = e.target.closest("button[data-pop]"); if (b) (b.dataset.pop === "tips" ? showTips : showPhotos)(); });

// photo lightbox
document.addEventListener("click", e => {
  const b = e.target.closest(".photo"); if (!b) return;
  const lb = document.createElement("div"); lb.className = "lightbox"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-label", "Check-in photo");
  const list = b.dataset.fulls ? JSON.parse(b.dataset.fulls) : [[b.dataset.full, b.dataset.fullAlt || ""]];
  let at = Math.min(+b.dataset.at || 0, list.length - 1);
  const cap = b.dataset.cap || "";
  lb.innerHTML = `<img alt="Check-in photo"><div class="cnt" aria-live="polite"></div>`;
  const big = lb.querySelector("img"), cnt = lb.querySelector(".cnt");
  const show = () => { big.dataset.alt = list[at][1] || ""; big.src = list[at][0]; cnt.textContent = [cap, list.length > 1 ? `${at + 1} of ${list.length} · tap the photo for the next one` : ""].filter(Boolean).join(" · "); };
  big.onerror = () => { const alt = big.dataset.alt; if (alt) { big.dataset.alt = ""; big.src = alt; } };
  big.onclick = ev => { if (list.length > 1) { ev.stopPropagation(); at = (at + 1) % list.length; show(); } };
  show();
  const close = () => { lb.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") { ev.stopImmediatePropagation(); close(); } };
  lb.onclick = close; document.addEventListener("keydown", onKey); document.body.appendChild(lb);
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => VIEWS[state.tab].stats && render(false), 150); });
init();
</script>
