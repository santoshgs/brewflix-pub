name: Foursquare check

# Run by hand (Actions > Foursquare check > Run workflow) to see which Foursquare
# endpoints still answer for your token. Prints field names and counts only,
# never your check-ins or the token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask Foursquare what still works
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: python scripts/foursquare_probe.py
